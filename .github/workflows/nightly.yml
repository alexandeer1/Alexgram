name: Nightly Build

on:
  push:
    branches:
      - merge
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/nightly.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: read
  actions: read
  models: read

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.var.outputs.build_timestamp }}
    steps:
      - id: var
        run: |
          echo "build_timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

  build:
    name: Gradle Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, universal]
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      NATIVE_TARGET: ${{ matrix.abi == 'universal' && 'arm64-v8a,armeabi-v7a,x86,x86_64' || matrix.abi }}
      BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
      APP_TIER: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ (matrix.abi == 'armeabi-v7a' || matrix.abi == 'universal') && '3.11' || '3.13' }}
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36 cmake;3.22.1"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Nightly Build
        id: nightly_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}
          APP_TIER: nightly
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP="${{ needs.setup.outputs.build_timestamp }}"
          export APP_TIER="nightly"
          ./gradlew TMessagesProj:assembleRelease

          APK_FILE=$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -n 1)
          APK_DIR=$(dirname "$APK_FILE")
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Nightly-${{ matrix.abi }}
          path: ${{ env.APK_DIR }}
      - name: Prepare Commit Details & AI Summary
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          DIFF_URL="${COMMIT_URL}.diff"
          PATCH_URL="${COMMIT_URL}.patch"
          COMMIT_JSON_URL="https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.head_commit.id }}"

          echo "Diff URL: $DIFF_URL"
          echo "Patch URL: $PATCH_URL"
          echo "Commit JSON URL: $COMMIT_JSON_URL"

          echo "diff_url=$DIFF_URL" >> $GITHUB_OUTPUT
          echo "patch_url=$PATCH_URL" >> $GITHUB_OUTPUT

          DIFF_RAW=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.diff" \
            "$DIFF_URL" || true)

          DIFF=$(echo "$DIFF_RAW" | grep -v 'Binary files' | head -c 20000)

          MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"

          USER_PROMPT="Analyze the following commit diff and provide a short, clear summary (3-5 bullet points) of the most important functional changes and bug fixes. Ignore boilerplate, whitespace, and formatting changes. Focus on what is new or fixed for users and developers.\n\nAuthor: $AUTHOR\nMessage: $MSG\n\nDiff:\n$DIFF"

          MODELS=(
            "gemini-2.5-flash"
            "gemini-2.0-flash"
            "gemini-1.5-flash"
            "gemini-1.5-pro"
            "gemini-2.0-pro-exp-02-05"
            "gemini-2.0-flash-lite"
            "gpt-4o-mini"
            "gpt-4o"
          )

          SUMMARY=""
          MODEL_ID=""

          for model in "${MODELS[@]}"; do
            echo "Attempting summary with model: $model"

            BODY=$(python3 -c "import json, sys; print(json.dumps({'model': '$model', 'messages': [{'role': 'user', 'content': sys.stdin.read()}]}))" <<< "$USER_PROMPT")

            RES=$(curl -s -w "\n%{http_code}" -X POST "https://models.inference.ai.azure.com/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -d "$BODY")

            HTTP_CODE=$(echo "$RES" | tail -n1)
            JSON_RES=$(echo "$RES" | sed '$d')

            echo "Response HTTP code: $HTTP_CODE"

            if [ "$HTTP_CODE" -eq 200 ]; then
              SUMMARY=$(echo "$JSON_RES" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data['choices'][0]['message']['content'])" 2>/dev/null || true)
              if [ -n "$SUMMARY" ]; then
                MODEL_ID="$model"
                echo "Successfully generated summary using $model"
                break
              fi
            fi

            echo "Model $model failed or returned empty summary, trying next..."
          done

          if [ -z "$SUMMARY" ]; then
            echo "All AI models failed, using commit message as fallback"
            COMBINED="$MSG"
            MODEL_ID="Commit Message (Fallback)"
          else
            COMBINED="$SUMMARY"
          fi

          COMBINED=$(echo "$COMBINED" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          COMBINED=$(echo "$COMBINED" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')

          COMBINED="$COMBINED\n\n<a href=\"$DIFF_URL\"><b>Full changes</b></a>\n\nGenerated by $MODEL_ID"

          echo "ai_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$COMBINED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Send to Telegram
        if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TG_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          TG_UPLOAD_CHAT_ID: ${{ secrets.HELPER_BOT_NIGHTLY_TARGET || '@Alexgram_Nightly' }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
          AI_SUMMARY: ${{ steps.prepare.outputs.ai_summary }}
          APK_PATH: ${{ env.APK_DIR }}
          APP_TIER: nightly
        run: |
          # send apk via telegram bot api
          find ${{ env.APK_DIR }} -name "*.apk"
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py "${{ secrets.HELPER_BOT_TOKEN }}" "${{ secrets.HELPER_BOT_NIGHTLY_TARGET || '@Alexgram_Nightly' }}" test
