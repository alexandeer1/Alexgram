name: Release Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.var.outputs.build_timestamp }}
    steps:
      - id: var
        run: |
          echo "build_timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

  build:
    name: Gradle Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, universal]
    env:
      NATIVE_TARGET: ${{ matrix.abi == 'universal' && 'arm64-v8a,armeabi-v7a,x86,x86_64' || matrix.abi }}
      BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.abi == 'armeabi-v7a' && '3.11' || '3.13' }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          TELEGRAM_APP_ID: ${{ secrets.APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP="${{ needs.setup.outputs.build_timestamp }}"
          ./gradlew TMessagesProj:assembleRelease

          APK_FILE=$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -n 1)
          APK_DIR=$(dirname "$APK_FILE")
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.abi }}
          path: ${{ env.APK_DIR }}
      - name: Send to Telegram
        if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TG_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          TG_UPLOAD_CHAT_ID: ${{ secrets.HELPER_BOT_TARGET }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
          APK_PATH: ${{ env.APK_DIR }}
        run: |
          # send apk via telegram bot api
          find ${{ env.APK_DIR }} -name "*.apk"
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} release ${{ secrets.HELPER_BOT_CANARY_TARGET }}
